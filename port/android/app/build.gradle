plugins {
    id "com.android.application"
}

// build/android in the repository root, where `ninja android` stages the
// native libraries (jniLibs) and the guest image (assets)
def staged = new File(rootDir, "../../build/android")

// a build of main knows its number (tools/ci_build.py), which names its
// release and which the self-updater (Updater.java) compares; others have
// none and never look for updates
def buildNumberText = System.getenv("HALO_BUILD_NUMBER") ?: "0"
def buildNumber = buildNumberText.isInteger() ? buildNumberText.toInteger() : 0

// the repository whose releases the self-updater looks at: the one being
// built (GITHUB_REPOSITORY in GitHub Actions, so a fork updates from itself)
def repository = System.getenv("GITHUB_REPOSITORY") ?: ""
if (!(repository ==~ /[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+/))
    repository = "OpenCommunityEdition/OpenCE"

// the workflow's signing key (.github/workflows/build.yml): every build of
// main signed with it can install over the one before; without it, the
// debug key of the computer that builds
def signingKey = System.getenv("HALO_ANDROID_KEYSTORE")

// The menus in French: copies of the PC menus' XML files (port/assets/menus)
// with the texts of port/assets/menus/lang/fr.json, made by
// tools/translate_menus.py from the menus as this checkout has them, so that
// they never fall behind them, and put in the app as assets/menus_fr. The app
// puts them beside config.toml when the game's language is French
// (MenuTranslation.java). Without Python the app has no French menus; the
// build goes on.
abstract class GenerateMenuTranslations extends DefaultTask {
    @InputFiles
    abstract ConfigurableFileCollection getSources()

    @InputFile
    abstract RegularFileProperty getTool()

    @OutputDirectory
    abstract DirectoryProperty getOutput()

    @TaskAction
    void generate() {
        File out = output.get().asFile
        out.deleteDir()
        out.mkdirs()
        for (String python : ["python3", "python", "py"]) {
            try {
                Process process = new ProcessBuilder(python, tool.get().asFile.absolutePath, "--lang", "fr",
                    "--out", new File(out, "menus_fr").absolutePath).redirectErrorStream(true).start()
                String text = process.inputStream.getText("UTF-8").trim()

                if (process.waitFor() == 0) {
                    logger.lifecycle(text)
                    return
                }
                logger.warn("${python}: ${text}")
            } catch (IOException ignored) {
                // no such command: the next
            }
        }
        logger.warn("no Python found: the app has no French menus")
    }
}

def menusFolder = new File(rootDir, "../../port/assets/menus")
def menusTool = new File(rootDir, "../../tools/translate_menus.py")

android {
    namespace "com.halo.decomp"
    compileSdk 35

    defaultConfig {
        // HALO_APPLICATION_ID_SUFFIX (for example ".vk") installs a build beside the one from
        // GitHub Actions, which another signing key stops it from replacing, with data of its own
        // (port/android/VULKAN.md); without it the id is com.halo.decomp, as always
        applicationId "com.halo.decomp" + (System.getenv("HALO_APPLICATION_ID_SUFFIX") ?: "")
        minSdk 28
        targetSdk 35
        versionCode Math.max(1, buildNumber)
        versionName buildNumber > 0 ? "build " + buildNumber : "1.0"
        buildConfigField "int", "HALO_BUILD_NUMBER", "${buildNumber}"
        buildConfigField "String", "HALO_REPOSITORY", "\"${repository}\""
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            java.srcDirs += new File(staged, "third_party/SDL3/android-project/app/src/main/java")
            jniLibs.srcDirs = [new File(staged, "jniLibs")]
            assets.srcDirs = [new File(staged, "assets")]
        }
    }

    // the guest image is read straight from the APK
    androidResources {
        noCompress += ["elf"]
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (signingKey) {
            halo {
                storeFile file(signingKey)
                storePassword System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HALO_ANDROID_KEY_ALIAS") ?: "halo"
                keyPassword System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingKey ? signingConfigs.halo : signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingKey ? signingConfigs.halo : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def generate = tasks.register("generate${variant.name.capitalize()}MenuTranslations",
                GenerateMenuTranslations) {
            sources.from(fileTree(menusFolder) {
                include "ce/*.xml", "lang/*.json", "lang/*/ce/**"
            })
            tool.set(menusTool)
        }
        variant.sources.assets?.addGeneratedSourceDirectory(generate, GenerateMenuTranslations::getOutput)
    }
}
